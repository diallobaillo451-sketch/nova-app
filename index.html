/* ---------- Moteur d'émulation (point de branchement) ---------- */
const CDN="https://cdn.emulatorjs.org/stable/data/";
const CORE={ps1:"psx",nes:"nes",fds:"nes",sfc:"snes",smc:"snes",gb:"gb",gbc:"gb",gba:"gba",nds:"nds",n64:"n64",z64:"n64",v64:"n64"};
const NOENG={ps2:"PS2 : aucun moteur web. Utilise l'app native Play!.",psp:"PSP : le moteur web ne fonctionne pas sur Safari. Utilise l'app PPSSPP (App Store)."};
let live=false;
const EJS_CONTROLS={0:{0:{value:'x',value2:'BUTTON_2'},1:{value:'s',value2:'BUTTON_4'},2:{value:'shift',value2:'SELECT'},3:{value:'enter',value2:'START'},4:{value:'up arrow',value2:'DPAD_UP'},5:{value:'down arrow',value2:'DPAD_DOWN'},6:{value:'left arrow',value2:'DPAD_LEFT'},7:{value:'right arrow',value2:'DPAD_RIGHT'},8:{value:'z',value2:'BUTTON_1'},9:{value:'a',value2:'BUTTON_3'},10:{value:'q',value2:'LEFT_TOP_SHOULDER'},11:{value:'e',value2:'RIGHT_TOP_SHOULDER'},12:{value:'1',value2:'LEFT_BOTTOM_SHOULDER'},13:{value:'3',value2:'RIGHT_BOTTOM_SHOULDER'},14:{value:'',value2:'LEFT_STICK'},15:{value:'',value2:'RIGHT_STICK'},16:{value:'h',value2:'LEFT_STICK_X:+1'},17:{value:'f',value2:'LEFT_STICK_X:-1'},18:{value:'g',value2:'LEFT_STICK_Y:+1'},19:{value:'t',value2:'LEFT_STICK_Y:-1'},20:{value:'l',value2:'RIGHT_STICK_X:+1'},21:{value:'j',value2:'RIGHT_STICK_X:-1'},22:{value:'k',value2:'RIGHT_STICK_Y:+1'},23:{value:'i',value2:'RIGHT_STICK_Y:-1'}},1:{},2:{},3:{}};
const INPUT_KEYS={tri:'s',cir:'x',crs:'z',sqr:'a',up:'up arrow',down:'down arrow',left:'left arrow',right:'right arrow',L1:'q',R1:'e',L2:'1',R2:'3',select:'shift',start:'enter'};
const KEY_CODES={'backspace':8,'tab':9,'enter':13,'shift':16,'left arrow':37,'up arrow':38,'right arrow':39,'down arrow':40};
const pressed=new Set();
const sendKey=(key,type)=>{const target=$('#ejs')||document;if(!target)return;const name=key.includes('arrow')?({ 'up arrow':'ArrowUp','down arrow':'ArrowDown','left arrow':'ArrowLeft','right arrow':'ArrowRight'})[key]:(key==='shift'?'Shift':key==='enter'?'Enter':key);const code=KEY_CODES[key]||((key.length===1)?key.toUpperCase().charCodeAt(0):0);const e=new KeyboardEvent(type,{key:name,code:name.length===1?'Key'+name.toUpperCase():name,bubbles:true,cancelable:true});Object.defineProperty(e,'keyCode',{value:code});Object.defineProperty(e,'which',{value:code});target.dispatchEvent(e)};
const snap=async(id,e)=>{try{const s=e&&e.screenshot;if(!s)return;const u=typeof s==='string'?s:URL.createObjectURL(s instanceof Blob?s:new Blob([s],{type:'image/png'}));const d=await shrink(u,640,0);if(typeof s!=='string')URL.revokeObjectURL(u);const g=S.games.find(x=>x.id===id);if(g&&setImg(id,'sh',d)){g.saved=Date.now();save();toast('Sauvegarde détectée')}}catch(err){}};
const engine={
	 async load(g,file){
  if(g.id==='test')return{t:'Mode test',m:'Appuie sur les boutons et bouge les sticks pour régler ta disposition.'};
  if(!file)return{t:'Fichier manquant',m:'Sélectionne à nouveau la ROM pour lancer ce jeu.'};
  if(NOENG[g.sys])return{t:'Moteur indisponible',m:NOENG[g.sys]};
  const ext=file.name.split('.').pop().toLowerCase(),core=g.sys==='ps1'?CORE.ps1:CORE[ext];
  if(!core)return{t:'Format non pris en charge',m:"."+ext+" n'est pas reconnu pour "+SYS[g.sys].n+"."};
  live=true;$('#player').classList.add('live');$('#screen').innerHTML='<div id="ejs"></div>';
  const c=eff(g.id),num=[...g.id].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7)%1e9+2;
  Object.assign(window,{EJS_player:'#ejs',EJS_core:core,EJS_gameUrl:URL.createObjectURL(file),EJS_gameName:g.name,EJS_gameID:num,EJS_pathtodata:CDN,EJS_color:'#0a84ff',EJS_backgroundColor:'#000',EJS_askBeforeExit:false,EJS_volume:c.vol,EJS_forceLegacyCores:!!c.gl1,EJS_defaultControls:EJS_CONTROLS,EJS_VirtualGamepadSettings:[],EJS_Buttons:{gamepad:{visible:false}},EJS_fixedSaveInterval:15000,EJS_defaultOptions:Object.assign({'save-state-location':'browser','virtual-gamepad':'disabled','menu-bar-button':'hidden'},c.crt?{shader:'crt-mattias.glslp'}:{}),EJS_onSaveUpdate:e=>snap(g.id,e),EJS_onExit:()=>location.reload()});
  const sc=document.createElement('script');sc.src=CDN+'loader.js';
  sc.onerror=()=>{live=false;$('#player').classList.remove('live');$('#screen').innerHTML='<div id="msg"><b>Moteur introuvable</b><span>Le chargement a échoué. Vérifie ta connexion ou l\'hébergement de la page.</span></div><div id="mon"></div>'};
  document.head.appendChild(sc);return null;
 },
 input(){},
	 input(state){if(!live)return;const wanted=new Set();Object.keys(state&&state.b||{}).forEach(k=>{if(INPUT_KEYS[k])wanted.add(INPUT_KEYS[k])});[['lx','f','h'],['ly','t','g'],['rx','j','l'],['ry','i','k']].forEach(([axis,neg,pos])=>{const v=state&&Number(state[axis]||0);if(v<-.2)wanted.add(neg);if(v>.2)wanted.add(pos)});pressed.forEach(k=>{if(!wanted.has(k))sendKey(k,'keyup')});wanted.forEach(k=>{if(!pressed.has(k))sendKey(k,'keydown')});pressed.clear();wanted.forEach(k=>pressed.add(k))},
	 stop(){pressed.forEach(k=>sendKey(k,'keyup'));pressed.clear();if(live)location.reload()}
};

/* ---------- Lecteur et commandes tactiles ---------- */
const inp={b:{},lx:0,ly:0,rx:0,ry:0},cnt={},SYM={tri:'△',cir:'○',crs:'✕',sqr:'□'};
const mon=()=>{const k=Object.keys(inp.b).map(x=>SYM[x]||x);$('#mon').textContent=k.length?k.join('  '):'Touche une zone'};
const hap=()=>{if(!S.set.hap)return;try{if(navigator.vibrate&&navigator.vibrate(8))return;const l=$('#hap');if(l)l.click()}catch(e){}};
let idleT;
const wake=()=>{const p=$('#player');p.classList.remove('idle');clearTimeout(idleT);if(S.set.fade)idleT=setTimeout(()=>p.classList.add('idle'),2800)};
$('#player').addEventListener('pointerdown',wake);
const hold=(k,d)=>{
 cnt[k]=(cnt[k]||0)+d;const on=cnt[k]>0;if(on===!!inp.b[k])return;
 if(on){inp.b[k]=1;hap()}else delete inp.b[k];
 document.querySelectorAll(`[data-k="${k}"]`).forEach(el=>el.classList.toggle('on',on));mon();engine.input(inp)};
const surf=(el,hit)=>{const P=new Map();
 const upd=e=>{const n=new Set(hit(e,el)),o=P.get(e.pointerId)||new Set();n.forEach(k=>o.has(k)||hold(k,1));o.forEach(k=>n.has(k)||hold(k,-1));P.set(e.pointerId,n)};
 el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);upd(e)});
 el.addEventListener('pointermove',e=>{if(P.has(e.pointerId))upd(e)});
 const end=e=>{(P.get(e.pointerId)||[]).forEach(k=>hold(k,-1));P.delete(e.pointerId);el.classList.remove('act')};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)};
const dirs=(e,el)=>{
 const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1,k=[];
 if(Math.hypot(x,y)>.22){if(x>.38)k.push('right');if(x<-.38)k.push('left');if(y>.38)k.push('down');if(y<-.38)k.push('up')}
 el.style.setProperty('--dx',x);el.style.setProperty('--dy',y);el.classList.toggle('act',k.length>0);return k};
const faces=(e,el)=>[...el.querySelectorAll('[data-k]')].filter(b=>{const q=b.getBoundingClientRect();return Math.hypot(e.clientX-q.left-q.width/2,e.clientY-q.top-q.height/2)<q.width*.62}).map(b=>b.dataset.k);
document.querySelectorAll('.gb[data-k]').forEach(el=>surf(el,()=>[el.dataset.k]));
surf($('.dpad'),dirs);surf($('.faces'),faces);
document.querySelectorAll('.stick').forEach(s=>{
 const kn=s.firstElementChild,a=s.dataset.s;
 const move=e=>{
  const r=s.getBoundingClientRect(),k=r.width/s.offsetWidth,R=32*k;
  let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const d=Math.hypot(x,y);if(d>R){x*=R/d;y*=R/d}
  kn.style.transform=`translate(${x/k}px,${y/k}px)`;
  const m=Math.hypot(x,y)/R,dz=S.set.dz,f=m<=dz?0:(m-dz)/(1-dz)/m;
  inp[a+'x']=+(x/R*f).toFixed(2);inp[a+'y']=+(y/R*f).toFixed(2);engine.input(inp)};
 s.addEventListener('pointerdown',e=>{e.preventDefault();s.setPointerCapture(e.pointerId);s.classList.add('on');hap();move(e)});
 s.addEventListener('pointermove',e=>{if(s.hasPointerCapture(e.pointerId))move(e)});
 const end=()=>{kn.style.transform='';s.classList.remove('on');inp[a+'x']=inp[a+'y']=0;engine.input(inp)};
 ['pointerup','pointercancel'].forEach(t=>s.addEventListener(t,end));
});
async function play(id){
 const g=all().find(x=>x.id===id);if(!g)return;
 if(g.id!=='test'&&!FILES.has(id)){RELINK=id;$('#file').click();return}
 closeSheet();
 S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,8);g.last=Date.now();save();SESSION=g.id==='test'?null:{id,at:Date.now()};
 $('#ptitle').textContent=g.name;$('#msg').innerHTML='<b>Chargement…</b>';
 $('#player').classList.toggle('px',!!eff(id).px);$('#player').classList.add('open');mon();wake();
 const r=await engine.load(g,FILES.get(id));
 if(r)$('#msg').innerHTML=`<b>${esc(r.t)}</b><span>${esc(r.m)}</span>`;
}

const A={
 tab:v=>{V.tab=v;render();scrollTo(0,0)},
 open:(v,id)=>detail(id),
 play:(v,id)=>play(id),
 add:()=>{RELINK=null;$('#file').click()},
 f:v=>{V.f=v;render()},
 sys:v=>{P.name=$('#nm').value;P.sys=v;addSheet()},
 commit:()=>{
  const g={id:Math.random().toString(36).slice(2,9),name:$('#nm').value.trim()||P.name,sys:P.sys,size:P.file.size};
  S.games.unshift(g);FILES.set(g.id,P.file);P=null;save();closeSheet();render()},
 del:(v,id)=>{S.games=S.games.filter(g=>g.id!==id);S.recent=S.recent.filter(x=>x!==id);FILES.delete(id);setImg(id,'cv');setImg(id,'sh');save();closeSheet();render()},
 cover:(v,id)=>{COVER=id;$('#img').click()},
 uncover:(v,id)=>{setImg(id,'cv');detail(id);render()},
 q:(v,id,d)=>{tgt(id)[d.p]=v==='1';save();if(id)detail(id);else render()},
 qreset:(v,id)=>{delete S.games.find(g=>g.id===id).o;save();detail(id)},
 theme:v=>{S.set.theme=v;save();apply();render()},
 tog:(v,id,d)=>{S.set[d.p]=!S.set[d.p];save();apply();render()},
 quit:()=>{
  if(SESSION){const g=S.games.find(x=>x.id===SESSION.id);if(g){g.t=(g.t||0)+Math.round((Date.now()-SESSION.at)/6e4);save()}SESSION=null}
  engine.stop();$('#player').classList.remove('open');render()},
 close:closeSheet
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t.dataset.v,t.dataset.id,t.dataset)});
document.addEventListener('input',e=>{
 const k=e.target.dataset.in;if(!k)return;
 if(k==='q'){V.q=e.target.value;$('#grid').innerHTML=grid();return}
 tgt(e.target.dataset.id)[k]=+e.target.value;save();apply();
});
$('#img').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f||!COVER)return;const id=COVER;COVER=null;
 try{const u=URL.createObjectURL(f),d=await shrink(u,480,640);URL.revokeObjectURL(u);toast(setImg(id,'cv',d)?'Pochette enregistrée':'Stockage plein');detail(id);render()}catch(err){toast('Image illisible')}
};
$('#file').onchange=e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 if(RELINK){const id=RELINK;RELINK=null;FILES.set(id,f);play(id);return}
 const x=f.name.split('.').pop().toLowerCase();
	 const sys=['nes','sfc','smc','gb','gbc','gba','nds','n64','z64','v64'].includes(x)?'nin':x==='cso'?'psp':['cue','pbp','img','ccd','mdf'].includes(x)?'ps1':f.size>7e8?'ps2':'ps1';
	 const g={id:Math.random().toString(36).slice(2,9),name:f.name.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim()||'Nouveau jeu',sys,size:f.size};
	 S.games.unshift(g);FILES.set(g.id,f);P=null;save();render();play(g.id);
};

apply();render();mon();
})();
</script>
</body>
</html>
